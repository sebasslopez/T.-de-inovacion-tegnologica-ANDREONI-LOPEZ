<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Instagram</title>
    <link rel="stylesheet" href="insta.css">
</head>
<body>
    <div class="header">
        <div class="profile-pic">
            <img src="images/profile.jpg" alt="Avatar" class="profile-img">
        </div>
        <section class="user-info">
            <h2>minecraft</h2>
            <div class="bio">
                <span>Minecraft</span>
                <p>Survive the night, or build a work of art.</p>
                <p>Welcome to Minecraft.</p>
                <p>ESRB RATING: EVERYONE 10+ with Fantasy Violence</p>
            </div>
             <button class="edit-btn">Editar perfil</button>
        </section>
    </div>

    <div class="tabs">
        <span id="selected">PUBLICACIONES</span>
        <span >REELS</span>
        <span >ETIQUETADAS</span>
    </div>

    <main class="gallery">
        <img src="images/post1.jpg" alt="Post 1" class="post-img">
        <img src="images/post2.jpg" alt="Post 2" class="post-img">
        <img src="images/post3.webp" alt="Post 3" class="post-img">
        <img src="images/post4.jpg" alt="Post 4" class="post-img">
        <img src="images/post5.jpg" alt="Post 5" class="post-img">
        <img src="images/post6.jpg" alt="Post 6" class="post-img">
    </main>
</body>
</html>
