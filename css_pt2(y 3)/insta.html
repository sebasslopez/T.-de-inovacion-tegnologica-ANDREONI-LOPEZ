<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil Instagram</title>
    <link rel="stylesheet" href="insta.css">
</head>
<body>
    <header class="header">
        <div class="profile-pic">
            <img src="images/avatar.jpg" alt="Avatar">
        </div>
        <section class="user-info">
            <h2>usuario_creativo</h2>
            <button class="edit-btn">Editar perfil</button>
            <div class="bio">
                <strong>Nombre de Usuario</strong>
                <p>Diseñador y Desarrollador Web</p>
            </div>
        </section>
    </header>

    <nav class="tabs">
        <span>PUBLICACIONES</span>
        <span>REELS</span>
        <span>ETIQUETADAS</span>
    </nav>

    <main class="gallery">
        <div class="post"><img src="images/post1.jpg" alt="Post 1"></div>
        <div class="post"><img src="images/post2.jpg" alt="Post 2"></div>
        <div class="post"><img src="images/post3.jpg" alt="Post 3"></div>
        <div class="post"><img src="images/post4.jpg" alt="Post 4"></div>
        <div class="post"><img src="images/post5.jpg" alt="Post 5"></div>
        <div class="post"><img src="images/post6.jpg" alt="Post 6"></div>
    </main>
</body>
</html>
