<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Usuario</title>
    <link rel="stylesheet" href="tarj_usr.css">
</head>
<body>
    <main class="container">
        <article class="card">
            <div class="banner"></div>
            <div class="profile-header">
                <img src="images/avatar.jpg" alt="Foto de perfil" class="avatar">
                <h1 class="name">Juan Pérez</h1>
                <p class="city">Buenos Aires, Argentina</p>
            </div>
            <hr>
            <div class="stats">
                <div class="stat-item">
                    <strong>80K</strong>
                    <span>Seguidores</span>
                </div>
                <div class="stat-item">
                    <strong>803K</strong>
                    <span>Likes</span>
                </div>
                <div class="stat-item">
                    <strong>1.4K</strong>
                    <span>Fotos</span>
                </div>
            </div>
        </article>
    </main>
</body>
</html>
