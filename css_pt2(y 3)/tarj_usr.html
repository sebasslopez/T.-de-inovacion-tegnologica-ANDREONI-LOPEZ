<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarjeta de Usuario</title>
    <link rel="stylesheet" href="tarj_usr.css">
</head>
<body>
    <main class="container">
        <div class="card">
            <div class="banner"></div>
            <div class="profile-header">
                <img src="images/profile_usr.jpg" alt="Foto de perfil" >
                <h1>Valentín Samoczko</h1>
                <p>Buenos Aires, Argentina</p>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <span class="stat-bold">1.2K</span>
                    <span class="stat-desc">Seguidores</span>
                </div>
                <div class="stat-item">
                    <span class="stat-bold">346</span>
                    <span class="stat-desc">Likes</span>
                </div>
                <div class="stat-item">
                    <span class="stat-bold">1</span>
                    <span class="stat-desc">Foto</span>
                </div>
            </div>
        </div>
    </main>
</body>
</html>
