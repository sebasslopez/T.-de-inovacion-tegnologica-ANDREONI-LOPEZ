<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
</head>
<body>
    <h2>Crear Cuenta</h2>
    <form>
        <label for="reg_usuario">Nombre de Usuario:</label><br>
        <input type="text" id="reg_usuario" name="reg_usuario" required><br><br>
        
        <label for="reg_email">Correo Electrónico:</label><br>
        <input type="email" id="reg_email" name="reg_email" required><br><br>
        
        <label for="reg_pass">Contraseña:</label><br>
        <input type="password" id="reg_pass" name="reg_pass" required><br><br>
        
        <label for="confirm_pass">Confirmar Contraseña:</label><br>
        <input type="password" id="confirm_pass" name="confirm_pass" required><br><br>
        
        <button type="submit">Registrarse</button>
    </form>
</body>
</html>
